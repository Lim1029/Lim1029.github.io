;\n                        }\n                        const kappa_nu = 0.1 * Math.pow(wavelength/300,-beta);\n                        const tau_nu = mu_H2 * m_H * N_H2 * kappa_nu;\n                        y[i] = B_nu_MJy*tau_nu;\n                    }\n                    source.change.emit();\n                    "}}]]]},"title":"Dust Temperature (K)","start":5,"end":100,"value":15,"step":5}}]}}]}}
